services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./web:/srv/web
      - ./server.crt:/etc/caddy/server.crt:ro
      - ./server.key:/etc/caddy/server.key:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    build:
      context: ../server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://${POSTGRES_USER:-intracom}:${POSTGRES_PASSWORD:-secretpassword}@postgres:5432/${POSTGRES_DB:-intracom}?sslmode=disable
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redispassword}@redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-super-secret-intracom-jwt-key-2026}
      - COTURN_SECRET=${COTURN_SECRET:-coturn-secret-shared-key-2026}
      - MINIO_ENDPOINT=minio:9000
    depends_on:
      - postgres
      - redis
      - coturn
    ports:
      - "8080:8080"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-intracom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secretpassword}
      POSTGRES_DB: ${POSTGRES_DB:-intracom}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../server/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redispassword}"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf

volumes:
  pg_data:
  redis_data:
  caddy_data:
  caddy_config:
