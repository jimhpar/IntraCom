# Coturn STUN/TURN Configuration for IntraCom
listening-port=3478
tls-listening-port=5349
min-port=49152
max-port=65535
external-ip=129.225.125.127/10.0.0.82

# Fingerprint in STUN messages
fingerprint

# Long-term credential mechanism
lt-cred-mech
use-auth-secret
static-auth-secret=coturn-secret-shared-key-2026
realm=intracom.local

# Security
no-tcp-relay
no-multicast-peers
no-cli
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
