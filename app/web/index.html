<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="IntraCom - Independent Calling & Real-Time Communication Network">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="IntraCom">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=2">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=2"/>
  <link rel="shortcut icon" type="image/png" href="favicon.png?v=2"/>

  <title>IntraCom</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preload" href="flutter_bootstrap.js" as="script" fetchpriority="high">

  <style>
    html, body {
      background-color: #000000;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #loading {
      position: fixed;
      inset: 0;
      background-color: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.4s ease-out;
    }
    .app-logo {
      width: 76px;
      height: 76px;
      background: #1C1C1E;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.08);
    }
    .app-logo svg {
      width: 38px;
      height: 38px;
      fill: #30D158;
    }
    .app-title {
      font-size: 24px;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }
    .app-subtitle {
      font-size: 13px;
      color: #8E8E93;
      margin-bottom: 36px;
      letter-spacing: 0.2px;
    }
    .ios-spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #30D158;
      border-radius: 50%;
      animation: spin 0.75s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="app-logo">
      <img src="icons/Icon-192.png?v=2" alt="IntraCom" style="width:76px;height:76px;border-radius:20px;object-fit:cover;display:block;" />
    </div>
    <div class="app-title">IntraCom</div>
    <div class="app-subtitle">Independent Calling Network</div>
    <div class="ios-spinner"></div>
  </div>

  <script>
    // Automatically hide splash screen when Flutter app renders
    window.addEventListener('load', function() {
      var observer = new MutationObserver(function(mutations, me) {
        var flutterView = document.querySelector('flutter-view, flt-glass-pane');
        if (flutterView) {
          var loading = document.getElementById('loading');
          if (loading) {
            loading.style.opacity = '0';
            setTimeout(function() { 
              if (loading.parentNode) loading.parentNode.removeChild(loading); 
            }, 400);
          }
          me.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });
    });

    // IntraCom Browser Audio Alerts & Tab Flash System
    (function() {
      var audioCtx = null;
      var ringtoneTimer = null;
      var ringbackTimer = null;
      var flashTimer = null;
      var baseTitle = 'IntraCom';

      function ensureCtx() {
        if (!audioCtx) {
          var Ctx = window.AudioContext || window.webkitAudioContext;
          if (Ctx) audioCtx = new Ctx();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume().catch(function(){});
        }
        return audioCtx;
      }

      // Unlock AudioContext on first user interaction
      ['pointerdown', 'keydown', 'touchstart'].forEach(function(evt) {
        document.addEventListener(evt, function() { ensureCtx(); }, { passive: true });
      });

      function playTone(freq, duration, type, gainVal, delay) {
        try {
          var ctx = ensureCtx();
          if (!ctx) return;
          var start = ctx.currentTime + (delay || 0);
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.type = type || 'sine';
          osc.frequency.setValueAtTime(freq, start);
          gain.gain.setValueAtTime(0.001, start);
          gain.gain.exponentialRampToValueAtTime(gainVal || 0.15, start + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, start + duration);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(start);
          osc.stop(start + duration + 0.02);
        } catch (e) {}
      }

      function ringBurst() {
        // Classic pleasant iOS-like dual-chord ring burst
        playTone(523.25, 0.25, 'sine', 0.16, 0.0);
        playTone(659.25, 0.25, 'sine', 0.16, 0.0);
        playTone(523.25, 0.25, 'sine', 0.16, 0.30);
        playTone(659.25, 0.25, 'sine', 0.16, 0.30);
      }

      function ringbackBurst() {
        // Subtle standard ringback tone (440Hz + 480Hz)
        playTone(440, 0.8, 'sine', 0.06, 0.0);
        playTone(480, 0.8, 'sine', 0.06, 0.0);
      }

      window.intracomAlerts = {
        playRingtone: function() {
          this.stopRingtone();
          ringBurst();
          ringtoneTimer = setInterval(ringBurst, 1800);
        },
        stopRingtone: function() {
          if (ringtoneTimer) { clearInterval(ringtoneTimer); ringtoneTimer = null; }
        },
        playRingback: function() {
          this.stopRingback();
          ringbackBurst();
          ringbackTimer = setInterval(ringbackBurst, 3000);
        },
        stopRingback: function() {
          if (ringbackTimer) { clearInterval(ringbackTimer); ringbackTimer = null; }
        },
        playMessageSound: function() {
          playTone(784.0, 0.12, 'sine', 0.14, 0.0);
          playTone(1046.5, 0.22, 'sine', 0.16, 0.10);
        },
        startTabFlash: function(alertText) {
          this.stopTabFlash();
          var toggle = false;
          document.title = alertText;
          flashTimer = setInterval(function() {
            toggle = !toggle;
            document.title = toggle ? baseTitle : alertText;
          }, 900);
        },
        stopTabFlash: function() {
          if (flashTimer) { clearInterval(flashTimer); flashTimer = null; }
          document.title = baseTitle;
        }
      };

      window.addEventListener('focus', function() {
        // Stop message tab flash when user returns to tab (call flash stops on answer/decline)
        if (flashTimer && document.title.indexOf('Call') === -1) {
          window.intracomAlerts.stopTabFlash();
        }
      });
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
